<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SCORM Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen p-6">

    <div class="max-w-7xl mx-auto">

        <h1 class="text-3xl font-bold mb-6 text-slate-800">
            📚 SCORM Library
        </h1>

        <div id="folders" class="space-y-4"></div>

    </div>

<script src="./paths.js"></script>

<script>
    window.addEventListener("load", () => {
        
        localStorage.setItem(
            "pathsData",
            JSON.stringify(pathsData)
        );

        displayFolders(pathsData);
    });
</script>

<script>
   

    function displayFolders(data) {

        const container = document.getElementById("folders");

        Object.entries(data).forEach(([mainFolder, files]) => {

            const card = document.createElement("div");

            card.className =
                "bg-white rounded-xl shadow border overflow-hidden";

            const fileList = Object.entries(files)
                .map(([name, info]) => `
                    <a href="${info.path.replace(/\\/g, '/')}"
                       target="_blank"
                       class="flex items-center gap-3 px-6 py-3 hover:bg-blue-50 border-t">

                        <span class="text-2xl">📄</span>

                        <div>
                            <div class="font-medium text-slate-700">
                                ${name}
                            </div>

                            <div class="text-xs text-gray-500 truncate">
                                ${info.path}
                            </div>
                        </div>
                    </a>
                `)
                .join("");

            card.innerHTML = `
                <div class="folder-header flex items-center gap-4 p-5 cursor-pointer hover:bg-slate-50">

                    <span class="text-4xl">📁</span>

                    <div class="flex-1">
                        <div class="font-bold text-lg text-slate-800">
                            ${mainFolder}
                        </div>

                        <div class="text-sm text-gray-500">
                            ${Object.keys(files).length} files
                        </div>
                    </div>

                    <div class="text-2xl arrow">
                        ▼
                    </div>
                </div>

                <div class="file-list hidden bg-gray-50">
                    ${fileList}
                </div>
            `;

            card.querySelector(".folder-header").onclick = () => {

                const list = card.querySelector(".file-list");
                const arrow = card.querySelector(".arrow");

                list.classList.toggle("hidden");

                arrow.innerHTML =
                    list.classList.contains("hidden")
                    ? "▼"
                    : "▲";
            };

            container.appendChild(card);
        });
    }
</script>

</body>
</html>
